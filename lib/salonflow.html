<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salonflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Salon Central brand: purple gradient #5B21B6 → #9333EA, Montserrat, dark #13131a chrome. */
:root {
  --glass: rgba(19, 19, 26, 0.80); --glass-hi: rgba(255, 255, 255, 0.05); --edge: rgba(255, 255, 255, 0.09);
  --ink: #f5f3fb; --muted: #a8a3c0; --faint: #6c6788;
  --accent: #7C3AED; --accent-light: #A78BFA; --accent-dim: rgba(124, 58, 237, 0.18);
  --grad: linear-gradient(135deg, #5B21B6 0%, #9333EA 100%);
  --pink: #ec4899; --green: #22c55e; --orange: #f97316; --red: #ef4444; --blue: #3b82f6; --yellow: #eab308;
  font: 13px/1.45 Montserrat, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: #120d1f; color: var(--ink); height: 100vh; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12px; } .faint { color: var(--faint); }
.green { color: var(--green); } .red { color: var(--red); } .orange { color: var(--orange); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#stage { position: fixed; inset: 0; }
#stage canvas { display: block; transition: opacity .18s; }
#stage.fade canvas { opacity: 0; }
.labels { position: absolute; inset: 0; pointer-events: none; }
#error { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 20px; color: var(--red); z-index: 20; }

.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid var(--edge); border-radius: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, .38); }
.panel-title { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }

/* Top bar */
.topbar { position: fixed; top: 12px; left: 12px; right: 12px; height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 14px; z-index: 6; }
.logo { height: 30px; display: block; }
.prod { border-left: 1px solid var(--edge); padding-left: 14px; line-height: 1.2; }
.prod b { font-size: 14px; } .prod div { font-size: 11px; color: var(--muted); }
.crumbs { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.crumbs button { padding: 6px 10px; border-radius: 8px; background: var(--glass-hi); border: 1px solid var(--edge); font-weight: 500; }
.crumbs button:hover { border-color: var(--accent-light); }
.spacer { flex: 1; }
.alertpill { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: rgba(239, 68, 68, .14); color: #fca5a5; font-weight: 600; font-size: 12px; }
.alertpill.calm { background: rgba(34, 197, 94, .12); color: #86efac; }
.alertpill svg.i { width: 15px; height: 15px; }
.clock { font-weight: 600; white-space: nowrap; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--glass-hi); border: 1px solid var(--edge); }
.seg button { padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--grad); color: #fff; }
.ghost { padding: 7px 11px; border-radius: 9px; border: 1px solid var(--edge); background: var(--glass-hi); font-size: 12px; font-weight: 600; }
.ghost:hover { border-color: var(--accent-light); }

/* KPI cards */
.kpis { position: fixed; top: 78px; left: 12px; display: flex; gap: 10px; max-width: calc(100vw - 380px); z-index: 5; }
.kpi { flex: 1 1 0; min-width: 150px; max-width: 230px; padding: 12px 14px; display: flex; gap: 12px; }
.kpi .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-dim); color: var(--accent-light); flex: none; }
.kpi .body { flex: 1; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .v { font-size: 21px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; }
.kpi .t { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.kpi .t span { color: var(--faint); font-weight: 500; }
.kpi .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 30px; flex: none; }
.bars i { width: 4px; border-radius: 2px 2px 0 0; background: var(--grad); min-height: 2px; }
.bars i.future { background: var(--edge); }
.bars i.now { background: var(--pink); }
.pips { display: flex; flex-wrap: wrap; gap: 3px; max-width: 74px; }
.pips i { width: 8px; height: 8px; border-radius: 2px; }

/* Detail card (top right) */
.detail { position: fixed; top: 78px; right: 12px; width: 344px; z-index: 5; overflow: hidden; }
.detail .head { display: flex; gap: 10px; align-items: flex-start; padding: 14px 14px 12px; border-left: 3px solid var(--accent); }
.detail .who { flex: 1; min-width: 0; }
.detail .name { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }
.detail .x { color: var(--muted); font-size: 20px; line-height: 1; padding: 0 2px; }
.route { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--edge); }
.route .big { font-size: 20px; font-weight: 700; }
.route .r { text-align: right; }
.route .mid { display: flex; align-items: center; gap: 4px; color: var(--accent-light); }
.route .mid::before, .route .mid::after { content: ''; width: 18px; height: 1px; background: var(--faint); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 5px 10px; padding: 12px 14px; border-top: 1px solid var(--edge); font-size: 12.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 2px; background: currentColor; }
.chip.green { color: #4ade80; background: rgba(34, 197, 94, .14); }
.chip.orange { color: #fb923c; background: rgba(249, 115, 22, .15); }
.chip.red { color: #f87171; background: rgba(239, 68, 68, .15); }
.chip.blue { color: #60a5fa; background: rgba(59, 130, 246, .15); }
.chip.purple { color: var(--accent-light); background: var(--accent-dim); }
.chip.muted { color: var(--muted); background: var(--glass-hi); }

/* Service tracker (bottom left) */
.tracker { position: fixed; left: 12px; bottom: 12px; width: calc(42vw - 18px); padding: 14px 16px 16px; z-index: 5; }
.tracker .top { display: flex; justify-content: space-between; gap: 12px; }
.tracker .sub { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; color: var(--muted); }
.tag { background: var(--grad); color: #fff; font-weight: 700; padding: 4px 11px; border-radius: 99px; font-size: 12px; }
.count { text-align: right; border-left: 2px solid var(--green); padding-left: 12px; }
.count.late { border-color: var(--red); } .count.wait { border-color: var(--orange); } .count.idle { border-color: var(--faint); }
.count .n { font-size: 24px; font-weight: 700; letter-spacing: -.4px; white-space: nowrap; }
.count .s { font-size: 12px; font-weight: 600; }
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 16px; }
.step { position: relative; padding-top: 32px; min-width: 0; }
.step::before { content: ''; position: absolute; top: 11px; left: 0; right: 0; height: 2px; background: var(--edge); }
.step.done::before { background: var(--accent); }
.step .c { position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--faint); background: #1b1726; display: grid; place-items: center; z-index: 1; }
.step .c svg { width: 13px; height: 13px; stroke-width: 3; }
.step.done .c { background: var(--grad); border-color: transparent; }
.step.now .c { border-color: var(--accent-light); box-shadow: 0 0 0 4px rgba(124, 58, 237, .3); }
.step.bad .c { border-color: var(--red); color: var(--red); }
.step .t { font-weight: 700; font-size: 13px; }
.step .l { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.est .t { color: var(--muted); font-style: italic; }

/* Operations table (bottom right) */
.ops { position: fixed; right: 12px; bottom: 12px; width: calc(58vw - 18px); max-height: 36vh; display: flex; flex-direction: column; z-index: 5; }
.ops.collapsed .tablewrap { display: none; }
.ops .bar { display: flex; align-items: center; gap: 4px; padding: 8px; border-bottom: 1px solid var(--edge); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 12.5px; color: var(--muted); }
.tabs button:hover { color: var(--ink); background: var(--glass-hi); }
.tabs button[aria-selected="true"] { background: var(--grad); color: #fff; }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: auto; padding: 0 6px; white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
.live.on i { background: var(--green); box-shadow: 0 0 0 0 rgba(34, 197, 94, .6); animation: ping 1.6s infinite; }
@keyframes ping { 70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
.caret { padding: 4px 8px; color: var(--muted); }
.tablewrap { overflow: auto; flex: 1; min-height: 0; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { position: sticky; top: 0; background: #1a1724; text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 8px 10px; white-space: nowrap; z-index: 1; }
td { padding: 7px 10px; border-top: 1px solid var(--edge); white-space: nowrap; }
td.wrap { white-space: normal; min-width: 220px; }
th.r, td.r { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--glass-hi); }
tbody tr.sel td { background: linear-gradient(90deg, rgba(91, 33, 182, .75), rgba(147, 51, 234, .55)); color: #fff; }
tbody tr.sel td .muted { color: #e9d5ff; }
.empty { color: var(--muted); font-style: italic; padding: 16px 10px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.dot.critical { background: var(--red); } .dot.warn { background: var(--orange); } .dot.info { background: var(--accent-light); }
.x2 { color: var(--muted); padding: 0 6px; font-size: 16px; }
.mixline { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.mixline b { color: var(--ink); }

/* 3D labels */
.blabel { pointer-events: auto; text-align: left; padding: 7px 10px; border-radius: 11px; background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(8px); box-shadow: 0 6px 16px rgba(0, 0, 0, .35); line-height: 1.3; min-width: 120px; }
.blabel:hover { border-color: var(--accent-light); }
.blabel b { display: block; font-size: 13px; }
.blabel .rev { font-size: 15px; font-weight: 700; }
.blabel .occ { font-size: 11px; color: var(--muted); }
.blabel .warnline { font-size: 11px; color: #f87171; font-weight: 600; }
.clabel { font-size: 11px; font-weight: 500; color: #d9cfe8; text-shadow: 0 1px 3px #000; }
.slabel { pointer-events: auto; cursor: pointer; width: 172px; padding: 7px 9px; border-radius: 10px; background: var(--glass); border: 1px solid var(--edge); border-top: 3px solid var(--green); box-shadow: 0 6px 16px rgba(0, 0, 0, .35); font-size: 11.5px; line-height: 1.3; }
.slabel.busy { border-top-color: var(--orange); } .slabel.late { border-top-color: var(--red); }
.slabel.sel { outline: 2px solid var(--accent-light); }
.slabel .t { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.slabel .t span { font-weight: 500; color: var(--muted); }
.slabel .pb { height: 4px; border-radius: 2px; background: var(--edge); margin: 5px 0 3px; overflow: hidden; }
.slabel .pb i { display: block; height: 100%; background: var(--grad); }
.slabel.late .pb i { background: var(--red); }
.rlabel { padding: 5px 9px; border-radius: 9px; background: var(--glass); border: 1px solid var(--edge); font-size: 11.5px; }

dialog { border: 1px solid var(--edge); border-radius: 14px; background: #1a1724; color: var(--ink); padding: 20px; width: min(430px, 92vw); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
dialog label { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--edge); }
dialog input { width: 80px; font: inherit; padding: 5px 7px; border: 1px solid var(--edge); border-radius: 7px; background: #120d1f; color: var(--ink); text-align: right; }
dialog menu { display: flex; justify-content: flex-end; gap: 8px; padding: 0; margin: 16px 0 0; }
dialog .primary { background: var(--grad); color: #fff; padding: 7px 14px; border-radius: 9px; font-weight: 600; }
dialog p { font-size: 12px; color: var(--muted); }

[hidden] { display: none !important; }

/* Below desktop width the panels stack under the scene instead of floating over it. */
@media (max-width: 1150px) {
  body { height: auto; overflow: auto; }
  #stage { position: relative; height: 58vh; }
  .topbar, .kpis, .detail, .tracker, .ops { position: static; width: auto; max-width: none; margin: 10px; }
  .topbar { height: auto; flex-wrap: wrap; padding: 10px; }
  .kpis { flex-wrap: wrap; }
  .kpi { max-width: none; min-width: 200px; }
  .ops { max-height: 70vh; }
  .tracker .top { flex-wrap: wrap; }
  .steps { grid-auto-columns: minmax(84px, 1fr); overflow-x: auto; padding-bottom: 4px; }
}
@media (max-width: 600px) {
  .kpi { flex-basis: 100%; min-width: 0; }
  .count { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { #stage canvas { transition: none; } .live.on i { animation: none; } }
</style>

const STATION_TYPES = { styling: 'Styling chair', wash: 'Wash basin', facial: 'Facial bed', nail: 'Mani-pedi chair', bridal: 'Bridal suite' };
const BRIDAL_RE = /bridal|barat|baraat|walima|valima|nikk?ah|mehe?n?di makeup|engagement|qawali/i;
const DESK_RE = /recep|front|desk|manager|owner|admin|cashier/i;
const MAX_STATIONS = 6;

// Which kind of station a service needs, best first. Guessed from category and name.
function stationTypesFor({ name, category }) {
  const n = name.toLowerCase(), c = (category ?? '').toLowerCase();
  if (/makeup|bridal/.test(c) || BRIDAL_RE.test(n)) return ['bridal', 'styling'];
  if (/nail|mani|pedi/.test(`${c} ${n}`)) return ['nail'];
  if (c === 'hair') return /wash|keratin|botox|nanoplast|protein|treatment|dye|colou?r/.test(n) ? ['wash', 'styling'] : ['styling'];
  if (/thread/.test(c)) return ['facial', 'styling'];
  if (/skin|facial|clean|massage|lash|wax|spa|body|brow/.test(c)) return ['facial'];
  return ['styling'];
}

// Turns an exported salon into what the simulation needs: one station per working staff
// member (front desk excluded). Each takes the kind of work she does that no station covers yet,
// most common on the menu first; once every kind is covered, the most common kinds repeat.
function prepareSalon(raw) {
  const services = raw.services.map(s => ({
    id: s.id, name: s.name, category: s.category, durationMin: s.durationMin, price: s.price, priceMax: s.priceMax ?? null,
    staffIds: s.staffIds ?? null, bridal: /makeup|bridal/i.test(s.category) && BRIDAL_RE.test(s.name),
    stationTypes: stationTypesFor(s), w: Math.max(0.3, 60 / s.durationMin),
  }));
  const branches = raw.branches.map(b => {
    const c = CITY[(b.city ?? '').trim().toLowerCase()];
    return { id: b.id, name: b.name, city: b.city || 'City not set', province: c?.[2] ?? 'unset', lat: c?.[0] ?? null, lon: c?.[1] ?? null, hours: b.hours ?? null };
  });
  const staff = [], stations = [];
  for (const b of branches) {
    const demand = {}, used = {};
    for (const s of services) demand[s.stationTypes[0]] = (demand[s.stationTypes[0]] ?? 0) + 1;
    let index = 0;
    for (const p of raw.staff.filter(p => (p.branchId ?? branches[0].id) === b.id)) {
      const desk = DESK_RE.test(p.role ?? '');
      let stationId = null;
      if (!desk && index < MAX_STATIONS) {
        const types = [...new Set(services.filter(s => !s.staffIds || s.staffIds.includes(p.id)).map(s => s.stationTypes[0]))];
        const type = types.sort((x, y) => (used[x] ?? 0) - (used[y] ?? 0) || demand[y] - demand[x])[0] ?? 'styling';
        used[type] = (used[type] ?? 0) + 1;
        stationId = `${b.id}-s${++index}`;
        stations.push({ id: stationId, branchId: b.id, index: index - 1, type, label: `${index} · ${STATION_TYPES[type]}` });
      }
      staff.push({ id: p.id, branchId: b.id, name: p.name, role: p.role || (desk ? 'Front desk' : 'Staff'), stationId });
    }
  }
  return { salon: { id: raw.id, name: raw.name }, branches, staff, stations, services };
}

// A branch's hours on a given PKT day (from its Settings → Hours, if exported).
function hoursOn(branch, day) {
  if (!branch.hours) return { open: true, from: '11:00', to: '21:00' };
  const name = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Karachi', weekday: 'long' }).format(day + 12 * HOUR);
  const h = branch.hours.find(x => x.day === name);
  return h?.open ? { open: true, from: h.from, to: h.to } : { open: false, from: '11:00', to: '11:00' };
}

const METHODS = [['cash', 50], ['card', 16], ['jazzcash', 12], ['easypaisa', 12], ['raast', 6], ['bank', 4]];
const SOURCES = [['whatsapp', 45], ['manual', 30], ['web', 25]];
const GAPS = [[0, 40], [15, 28], [30, 15], [60, 10], [90, 7]];

const FIRST = ['Ayesha', 'Fatima', 'Zainab', 'Maryam', 'Hira', 'Sana', 'Amna', 'Mahnoor', 'Iqra', 'Areeba', 'Komal', 'Nimra', 'Sidra', 'Rimsha', 'Anum', 'Kiran', 'Sadia', 'Saima', 'Bushra', 'Nadia', 'Farah', 'Uzma', 'Asma', 'Laiba', 'Hafsa', 'Dua', 'Eman', 'Momina', 'Javeria', 'Mehreen', 'Aiman', 'Ramsha', 'Aleena', 'Zoya', 'Noor', 'Tooba', 'Wajiha', 'Shiza', 'Hadia', 'Maham'];
const LAST = ['Khan', 'Malik', 'Butt', 'Sheikh', 'Chaudhry', 'Qureshi', 'Siddiqui', 'Raza', 'Hussain', 'Ahmed', 'Abbasi', 'Mirza', 'Baig', 'Awan', 'Rana', 'Hashmi', 'Zaidi', 'Bukhari', 'Memon', 'Shah', 'Javed', 'Iqbal', 'Aslam', 'Rehman'];
const MOBILE_PREFIXES = ['300', '301', '302', '303', '304', '305', '306', '307', '308', '309', '310', '311', '312', '313', '315', '320', '321', '322', '323', '324', '331', '332', '333', '334', '335', '336', '340', '341', '342', '343', '344', '345', '346', '347'];

class MockAdapter {
  constructor(raw, { seed = 20261011, speed = 30, now = Date.now(), shadow = false } = {}) {
    Object.assign(this, prepareSalon(raw));
    this.rng = mulberry32(seed);
    this.speed = speed;
    this.tax = structuredClone(TAX);
    const names = new Set();
    while (names.size < 400) names.add(`${this.pick(FIRST)} ${this.pick(LAST)}`);
    this.clients = [...names].map((name, i) => ({ id: `C${1001 + i}`, name, phone: `+92 ${this.pick(MOBILE_PREFIXES)} ${String(Math.floor(this.rng() * 1e7)).padStart(7, '0')}` }));

    // Start the simulated day at the current PKT time if the salon is open, else midway through its day.
    this.newDay(pktMidnight(now));
    const target = now > this.dayStart && now < this.dayEnd - 30 * MIN ? now - (now % MIN) : this.dayStart + Math.round((this.dayEnd - this.dayStart) / 2 / MIN) * MIN;
    while (this.now < target) this.step();
    // A second simulated day, one week earlier, run in lockstep: gives honest "vs last week" figures.
    if (!shadow) this.lastWeek = new MockAdapter(raw, { seed: seed + 1, speed, now: now - 7 * DAY, shadow: true });
  }

  // ── randomness helpers
  pick(arr) { return arr[Math.floor(this.rng() * arr.length)]; }
  weighted(pairs) { let r = this.rng() * pairs.reduce((s, p) => s + p[1], 0); for (const p of pairs) if ((r -= p[1]) < 0) return p[0]; return pairs[0][0]; }
  int(a, b) { return a + Math.floor(this.rng() * (b - a + 1)); }

  newDay(day) {
    this.day = day;
    this.branches = this.branches.map(b => { const h = hoursOn(b, day); return { ...b, open: h.open, opensAt: h.from, closesAt: h.to }; });
    const open = this.branches.filter(b => b.open);
    this.dayStart = day + (open.length ? Math.min(...open.map(b => hm(b.opensAt))) : hm('11:00'));
    this.dayEnd = day + (open.length ? Math.max(...open.map(b => hm(b.closesAt))) : hm('21:00'));
    this.now = this.dayStart - 30 * MIN;
    this.appts = []; this.payments = []; this.events = []; this.sim = new Map(); this.seq = 0;
    for (const st of this.stations) {
      const b = this.branches.find(x => x.id === st.branchId);
      if (!b.open) continue;
      const close = day + hm(b.closesAt), who = this.staffFor(st);
      const menu = this.services.filter(s => s.stationTypes.includes(st.type) && (!s.staffIds || s.staffIds.includes(who.id))).map(s => [s, s.w]);
      if (!menu.length) continue;
      let t = day + hm(b.opensAt) + this.pick([0, 0, 15, 30]) * MIN;
      for (;;) {
        let svc = this.weighted(menu);
        for (let i = 0; i < 4 && t + svc.durationMin * MIN > close; i++) svc = this.weighted(menu);
        if (t + svc.durationMin * MIN > close) break;
        this.book(st, svc, t, this.weighted(SOURCES), this.rng() < 0.7 ? 'confirmed' : 'booked');
        t += svc.durationMin * MIN + this.weighted(GAPS) * MIN;
      }
    }
  }

  staffFor(station) { return this.staff.find(p => p.stationId === station.id); }

  book(station, svc, start, source, status) {
    const client = this.pick(this.clients), bridal = svc.bridal, step = bridal ? 5000 : 500;
    const price = svc.priceMax ? svc.price + Math.round(this.rng() * (svc.priceMax - svc.price) / step) * step : svc.price;
    const a = {
      id: `A${this.day / DAY | 0}-${++this.seq}`, branchId: station.branchId, stationId: station.id,
      staffId: this.staffFor(station).id, clientId: client.id, serviceId: svc.id,
      start, end: start + svc.durationMin * MIN, status, source, price,
    };
    if (bridal) {
      const due = Math.round(price * 0.4 / 1000) * 1000, r = this.rng();
      const advanceStatus = r < 0.7 ? 'paid' : r < 0.9 ? 'partial' : 'pending';
      a.bridal = { advanceDue: due, advancePaid: advanceStatus === 'paid' ? due : advanceStatus === 'partial' ? due / 2 : 0, advanceStatus };
    }
    // Hidden simulation facts the UI must not see (a real backend wouldn't know them either).
    this.sim.set(a.id, {
      arriveAt: start + (bridal ? this.int(-25, -5) : this.int(-15, 8)) * MIN,
      noShow: source !== 'walk-in' && !bridal && this.rng() < 0.05,
      actualMin: Math.round(svc.durationMin * (0.9 + this.rng() * 0.35)),
    });
    this.appts.push(a);
    return a;
  }

  step() {
    this.lastWeek?.step();
    this.now += MIN;
    const now = this.now;
    if (now >= this.dayEnd + 90 * MIN) return this.newDay(this.day + DAY);

    for (const a of this.appts) {
      const s = this.sim.get(a.id);
      if (a.status === 'booked' || a.status === 'confirmed') {
        if (s.noShow) {
          if (now >= a.start + 20 * MIN) { a.status = 'no-show'; this.event(a.branchId, 'warn', 'no-show', `${this.clientName(a)} did not come for ${this.svc(a).name} (${clock(a.start)})`, a.id); }
        } else if (now >= s.arriveAt) { a.status = 'arrived'; a.arrivedAt = now; }
      } else if (a.status === 'in-progress' && now >= a.startedAt + s.actualMin * MIN) {
        a.status = 'completed'; a.completedAt = now; this.pay(a);
      }
    }
    for (const st of this.stations) {
      const mine = this.appts.filter(a => a.stationId === st.id);
      if (mine.some(a => a.status === 'in-progress')) continue;
      const next = mine.filter(a => a.status === 'arrived' && a.start <= now + 5 * MIN).sort((x, y) => x.start - y.start)[0];
      if (next) { next.status = 'in-progress'; next.startedAt = now; }
    }
    for (const b of this.branches) {
      if (b.open && now > this.day + hm(b.opensAt) && now < this.day + hm(b.closesAt) - HOUR && this.rng() < 0.012) this.walkIn(b);
    }
  }

  walkIn(b) {
    const stations = this.stations.filter(s => s.branchId === b.id);
    const can = (st, s) => s.stationTypes.includes(st.type) && (!s.staffIds || s.staffIds.includes(this.staffFor(st).id));
    const options = this.services.filter(s => !s.bridal && s.durationMin <= 45 && stations.some(st => can(st, s)));
    if (!options.length) return;
    const svc = this.pick(options), now = this.now;
    const free = stations.find(st => can(st, svc) &&
      !this.appts.some(a => a.stationId === st.id && ACTIVE.includes(a.status) && a.start < now + (svc.durationMin + 10) * MIN && (a.status === 'in-progress' || a.end > now)));
    if (!free) return this.event(b.id, 'info', 'walk-in-lost', `Walk-in for ${svc.name} turned away — no free ${svc.stationTypes.map(t => STATION_TYPES[t].toLowerCase()).join(' or ')}`);
    const a = this.book(free, svc, now, 'walk-in', 'arrived');
    a.arrivedAt = now;
  }

  pay(a) {
    const rate = this.tax[this.branches.find(b => b.id === a.branchId).province].rate;
    const subtotal = a.price - (a.bridal?.advancePaid ?? 0);
    const tax = taxOn(subtotal, rate);
    const tip = this.rng() < 0.25 ? this.pick([100, 200, 500, 1000]) : 0;
    this.payments.push({ id: `P${a.id.slice(1)}`, appointmentId: a.id, branchId: a.branchId, at: this.now, subtotal, taxRate: rate, tax, tip, total: subtotal + tax + tip, method: this.weighted(METHODS) });
  }

  event(branchId, level, kind, text, appointmentId) {
    this.events.push({ id: `ev${this.events.length}-${this.now}`, branchId, level, kind, text, at: this.now, appointmentId });
  }

  svc(a) { return this.services.find(s => s.id === a.serviceId); }
  clientName(a) { return this.clients.find(c => c.id === a.clientId).name; }

  alerts() {
    return [...this.events.filter(e => this.now - e.at < 90 * MIN),
      ...opsAlerts({ now: this.now, appointments: this.appts, services: this.services, clients: this.clients, stations: this.stations, staff: this.staff })];
  }

  snapshot() {
    return {
      now: this.now, live: false, speed: this.speed, salon: this.salon, salons: SALONS.map(({ id, name }) => ({ id, name })),
      config: { tax: structuredClone(this.tax) },
      branches: this.branches.map(({ hours, ...b }) => b), stations: this.stations, staff: this.staff, clients: this.clients,
      services: this.services.map(({ w, staffIds, ...s }) => s),
      appointments: this.appts.map(a => ({ ...a, bridal: a.bridal && { ...a.bridal } })),
      payments: [...this.payments], alerts: this.alerts(),
      lastWeek: this.lastWeek && {
        date: this.lastWeek.day,
        byBranch: Object.fromEntries(this.branches.map(b => [b.id, {
          collected: this.lastWeek.payments.filter(p => p.branchId === b.id).reduce((t, p) => t + p.total, 0),
          served: this.lastWeek.appts.filter(a => a.branchId === b.id && a.status === 'completed').length,
        }])),
      },
    };
  }

  start(emit) {
    this.emit = emit;
    let acc = 0;
    this.timer = setInterval(() => {
      acc += 250 * this.speed;
      let stepped = false;
      while (acc >= MIN) { acc -= MIN; this.step(); stepped = true; }
      if (stepped) emit(this.snapshot());
    }, 250);
    emit(this.snapshot());
  }
  stop() { clearInterval(this.timer); }
  command(name, args) {
    if (name === 'setSpeed') this.speed = args;
    else if (name === 'setTaxRate') this.tax[args.province].rate = args.rate;
    else throw new Error(`Unknown command ${name}`);
    this.emit(this.snapshot());
  }
}

// Overruns, long waits and unpaid bridal advances, worked out from the appointments alone,
// so the simulation and live data raise them the same way.
function opsAlerts({ now, appointments, services, clients, stations, staff }) {
  const by = arr => new Map(arr.map(x => [x.id, x]));
  const svcs = by(services), people = by(clients), seats = by(stations), team = by(staff);
  const out = [];
  for (const a of appointments) {
    const svc = svcs.get(a.serviceId), clientName = people.get(a.clientId).name;
    if (a.status === 'in-progress') {
      const over = Math.round((now - a.startedAt - (a.end - a.start)) / MIN);
      if (over >= 10) {
        out.push({ id: `over:${a.id}`, branchId: a.branchId, level: over >= 25 ? 'critical' : 'warn', kind: 'overrun', at: now - over * MIN, appointmentId: a.id, text: `${svc.name} on station ${seats.get(a.stationId).label} is ${over} min over (${team.get(a.staffId).name})` });
      }
    } else if (a.status === 'arrived') {
      const waited = Math.round((now - Math.max(a.arrivedAt, a.start)) / MIN);
      if (waited >= 15) out.push({ id: `wait:${a.id}`, branchId: a.branchId, level: waited >= 30 ? 'critical' : 'warn', kind: 'waiting', at: now - waited * MIN, appointmentId: a.id, text: `${clientName} waiting ${waited} min for ${svc.name}` });
    }
    if (a.bridal && a.bridal.advanceStatus !== 'paid' && ACTIVE.includes(a.status)) {
      out.push({ id: `adv:${a.id}`, branchId: a.branchId, level: a.bridal.advanceStatus === 'pending' ? 'critical' : 'warn', kind: 'bridal-advance', at: a.start, appointmentId: a.id,
        text: `${svc.name} for ${clientName} at ${clock(a.start)} — advance ${a.bridal.advanceStatus} (Rs ${a.bridal.advancePaid.toLocaleString('en-US')} of ${a.bridal.advanceDue.toLocaleString('en-US')})` });
    }
  }
  return out;
}

// Turns GET /api/salonflow (today's real appointments and paid bills, see app/api/salonflow/route.ts)
// into a Snapshot. Stations come from the staff list exactly as in the simulation.
function liveSnapshot(raw) {
  const now = raw.now, day = pktMidnight(now);
  // Staff with bookings today get the limited stations first.
  const booked = new Set(raw.appointments.map(a => a.staffId));
  const prep = prepareSalon({ ...raw.salon, branches: raw.branches.map(b => ({ ...b, hours: raw.hours })),
    staff: [...raw.staff].sort((x, y) => booked.has(y.id) - booked.has(x.id)), services: raw.services });
  const branches = prep.branches.map(({ hours, ...b }) => { const h = hoursOn({ hours }, day); return { ...b, open: h.open, opensAt: h.from, closesAt: h.to }; });
  const { stations, staff } = prep;
  // A branch with no working staff on record still needs somewhere to show its bookings.
  for (const b of branches) {
    if (stations.some(st => st.branchId === b.id)) continue;
    stations.push({ id: `${b.id}-s1`, branchId: b.id, index: 0, type: 'styling', label: `1 · ${STATION_TYPES.styling}` });
    staff.push({ id: `${b.id}-team`, branchId: b.id, name: 'Team', role: 'Staff', stationId: `${b.id}-s1` });
  }
  const services = prep.services.map(({ w, staffIds, bridal, ...s }) => s);
  const svcById = new Map(services.map(s => [s.id, s])), staffById = new Map(staff.map(p => [p.id, p]));
  const clients = new Map(), appointments = [], payments = [];
  const seen = t => Number.isFinite(t) && t >= day && t <= now ? t : null;

  function add(r) {
    // ponytail: a booking with several services, or one the staff member has no station for, goes on the
    // first station of the branch / under one combined menu line. Fine for a glance, not for staff reports.
    const known = staffById.get(r.staffId);
    const station = (known?.branchId === r.branchId && known.stationId && stations.find(st => st.id === known.stationId))
      || stations.find(st => st.branchId === r.branchId);
    const who = known?.branchId === r.branchId ? known : staff.find(p => p.stationId === station.id);
    let serviceId = r.serviceIds.length === 1 && svcById.has(r.serviceIds[0]) ? r.serviceIds[0] : null;
    if (!serviceId) {
      const first = svcById.get(r.serviceIds[0]);
      serviceId = `booking:${r.id}`;
      const svc = { id: serviceId, name: r.serviceNames.join(' + ') || 'Service', category: first?.category ?? 'other', durationMin: Math.round((r.end - r.start) / MIN), price: r.price, priceMax: null };
      svc.stationTypes = stationTypesFor(svc);
      services.push(svc); svcById.set(serviceId, svc);
    }
    if (!clients.has(r.clientId)) clients.set(r.clientId, { id: r.clientId, name: r.clientName, phone: r.clientPhone });
    const changed = seen(r.changedAt);
    const a = { id: r.id, branchId: r.branchId, stationId: station.id, staffId: who.id, clientId: r.clientId, serviceId,
      start: r.start, end: r.end, status: r.status, source: ['whatsapp', 'walk-in', 'web', 'manual'].includes(r.source) ? r.source : 'manual', price: r.price };
    if (a.status === 'arrived') a.arrivedAt = changed ?? Math.min(a.start, now);
    if (a.status === 'in-progress') a.arrivedAt = a.startedAt = changed ?? Math.min(a.start, now);
    if (a.status === 'completed') { a.arrivedAt = a.startedAt = a.start; a.completedAt = seen(r.completedAt) ?? changed ?? Math.min(a.end, now); }
    appointments.push(a);
    return a;
  }

  raw.appointments.forEach(add);
  const apptById = new Map(appointments.map(a => [a.id, a]));
  for (const p of raw.payments) {
    const subtotal = p.total - p.tax;
    // A counter sale with no booking today shows as a finished walk-in so its money is counted.
    const a = apptById.get(p.appointmentId) ?? add({ id: `sale:${p.id}`, branchId: p.branchId, staffId: p.staffId, clientId: p.clientId || `sale:${p.id}`,
      clientName: p.clientName, clientPhone: p.clientPhone, serviceIds: [], serviceNames: [p.description],
      start: p.at - 30 * MIN, end: p.at, status: 'completed', source: 'walk-in', price: subtotal, completedAt: p.at });
    payments.push({ id: p.id, appointmentId: a.id, branchId: p.branchId, at: p.at, subtotal, taxRate: subtotal ? Math.round(p.tax / subtotal * 1000) / 10 : 0,
      tax: p.tax, tip: 0, total: p.total, method: METHOD_LABEL[p.method] ? p.method : 'cash' });
  }

  const snap = { now, live: true, speed: null, salon: prep.salon, config: { tax: structuredClone(TAX) },
    branches, stations, staff, clients: [...clients.values()], services, appointments, payments, lastWeek: raw.lastWeek };
  const noShows = appointments.filter(a => a.status === 'no-show' && now - a.start < 2 * HOUR).map(a => ({ id: `noshow:${a.id}`, branchId: a.branchId, level: 'warn', kind: 'no-show', at: a.start, appointmentId: a.id,
    text: `${clients.get(a.clientId).name} did not come for ${svcById.get(a.serviceId).name} (${clock(a.start)})` }));
  return { ...snap, alerts: [...noShows, ...opsAlerts(snap)] };
}

// Polls the app's own API; the page is served by the app (/dashboard/salonflow), so the login cookie goes along.
class LiveAdapter {
  constructor(url = '/api/salonflow', everyMs = 15_000) { Object.assign(this, { url, everyMs }); }
  async load() {
    const res = await fetch(this.url, { credentials: 'same-origin', cache: 'no-store' });
    if (res.status === 401) throw new Error('please sign in to Salon Central first');
    if (res.status === 403) throw new Error("your login can't see the salon's takings — ask the owner");
    if (!res.ok) throw new Error(`the server answered ${res.status}`);
    return liveSnapshot(await res.json());
  }
  async start(emit) {
    emit(await this.load());
    // A failed refresh keeps the last good picture on screen and tries again next time.
    this.timer = setInterval(() => this.load().then(emit, err => console.warn('Salonflow refresh failed:', err)), this.everyMs);
  }
  stop() { clearInterval(this.timer); }
  command(name) { throw new Error(`${name} is only for the simulation`); }
}

const DataSource = (() => {
  let adapter = null, snap = null;
  const subs = new Set();
  return {
    use(a, onError) {
      adapter?.stop();
      adapter = a;
      Promise.resolve(a.start(s => { snap = s; subs.forEach(fn => fn(s)); })).catch(onError);
    },
    subscribe(fn) { subs.add(fn); if (snap) fn(snap); return () => subs.delete(fn); },
    command: (name, args) => adapter.command(name, args),
  };
})();

// ── Selectors: everything the UI shows is derived here from a snapshot.
const indexCache = new WeakMap();
function idx(s) {
  if (!indexCache.has(s)) {
    const by = arr => new Map(arr.map(x => [x.id, x]));
    indexCache.set(s, { branch: by(s.branches), station: by(s.stations), staff: by(s.staff), client: by(s.clients), service: by(s.services), appt: by(s.appointments) });
  }
  return indexCache.get(s);
}

function stats(s, branchId = null) {
  const inScope = x => !branchId || x.branchId === branchId;
  const appts = s.appointments.filter(inScope), pays = s.payments.filter(inScope), stations = s.stations.filter(inScope);
  const busy = appts.filter(a => a.status === 'in-progress');
  const late = busy.filter(a => s.now > a.startedAt + (a.end - a.start));
  const waiting = appts.filter(a => a.status === 'arrived');
  const sum = k => pays.reduce((t, p) => t + p[k], 0);
  const bridal = appts.filter(a => a.bridal && a.status !== 'cancelled');
  const byMethod = {};
  for (const p of pays) byMethod[p.method] = (byMethod[p.method] ?? 0) + p.total;
  return {
    stations: stations.length, busy: busy.length, late: late.length, lateIds: new Set(late.map(a => a.id)),
    waiting: waiting.length, longestWait: Math.max(0, ...waiting.map(a => Math.round((s.now - Math.max(a.arrivedAt, a.start)) / MIN))),
    collected: sum('total'), net: sum('subtotal'), tax: sum('tax'), tips: sum('tip'), byMethod,
    booked: appts.filter(a => a.status !== 'cancelled').length, done: appts.filter(a => a.status === 'completed').length,
    noShows: appts.filter(a => a.status === 'no-show').length, walkIns: appts.filter(a => a.source === 'walk-in').length,
    bridal: bridal.length, bridalValue: bridal.reduce((t, a) => t + a.price, 0),
    advancesHeld: bridal.filter(a => a.status !== 'completed').reduce((t, a) => t + a.bridal.advancePaid, 0),
    advancesOpen: bridal.filter(a => a.bridal.advanceStatus !== 'paid' && ACTIVE.includes(a.status)).length,
  };
}

// Same figures for the same weekday last week, or null when the source doesn't provide them.
function lastWeekStats(s, branchId = null) {
  if (!s.lastWeek) return null;
  const rows = Object.entries(s.lastWeek.byBranch).filter(([id]) => !branchId || id === branchId).map(([, v]) => v);
  return { collected: rows.reduce((t, r) => t + r.collected, 0), served: rows.reduce((t, r) => t + r.served, 0) };
}

// Today by opening hour: money collected and clients finished in each hour.
function hourly(s, branchId = null) {
  const inScope = x => !branchId || x.branchId === branchId, day = pktMidnight(s.now);
  const bs = s.branches.filter(b => (!branchId || b.id === branchId) && b.open !== false);
  if (!bs.length) return { rows: [], current: -1 };
  const h0 = Math.min(...bs.map(b => hm(b.opensAt))) / HOUR, h1 = Math.ceil(Math.max(...bs.map(b => hm(b.closesAt))) / HOUR);
  const rows = Array.from({ length: h1 - h0 }, (_, i) => ({ h: h0 + i, collected: 0, served: 0 }));
  const slot = t => rows[Math.min(rows.length - 1, Math.max(0, Math.floor((t - day) / HOUR) - h0))];
  for (const p of s.payments) if (inScope(p)) slot(p.at).collected += p.total;
  for (const a of s.appointments) if (inScope(a) && a.status === 'completed') slot(a.completedAt).served++;
  return { rows, current: Math.floor((s.now - day) / HOUR) - h0 };
}

function stationState(s, station) {
  const mine = s.appointments.filter(a => a.stationId === station.id);
  const current = mine.find(a => a.status === 'in-progress') ?? null;
  const next = mine.filter(a => ['booked', 'confirmed', 'arrived'].includes(a.status)).sort((a, b) => a.start - b.start)[0] ?? null;
  if (!current) return { state: 'free', current, next };
  const planned = current.end - current.start, elapsed = s.now - current.startedAt;
  return { state: elapsed > planned ? 'late' : 'busy', current, next, progress: Math.min(1, elapsed / planned), minsLeft: Math.round((planned - elapsed) / MIN) };
}

// ── Formatting (shared by data and UI)
const TZ = 'Asia/Karachi';
const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const rs = n => `Rs ${nf.format(Math.round(n))}`;
const clockFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const clock = t => clockFmt.format(t);
const dateFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const maskPhone = p => p.replace(/^\+92 (3\d\d) (\d{4})(\d{3})$/, '+92 $1 ****$3');
const shortName = n => { const [f, l] = n.split(' '); return l ? `${f} ${l[0]}.` : f; };
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const METHOD_LABEL = { cash: 'Cash', card: 'Card', jazzcash: 'JazzCash', easypaisa: 'Easypaisa', raast: 'Raast', bank: 'Bank transfer' };

// Self-check: open with ?selftest to run (results in the console and on the page).
function selfTest() {
  const assert = (ok, msg) => { if (!ok) throw new Error(`Self-test failed: ${msg}`); };
  assert(maskPhone('+92 321 4567890') === '+92 321 ****890', 'phone mask');
  assert(rs(1234567.4) === 'Rs 1,234,567', 'PKR format');
  assert(taxOn(10000, 16) === 1600 && taxOn(2500, 15) === 375, 'tax');
  // A made-up two-city salon exercises the setup rules; the real salons are run below.
  const fixture = prepareSalon({ id: 't', name: 'Test', branches: [{ id: 'a', name: 'A', city: 'Lahore' }, { id: 'b', name: 'B', city: ' karachi ' }, { id: 'c', name: 'C', city: '' }],
    staff: [{ id: 'p1', name: 'P1', role: 'Receptionist', branchId: 'a' }, ...Array.from({ length: 8 }, (_, i) => ({ id: `q${i}`, name: `Q${i}`, role: '', branchId: 'a' }))],
    services: [{ id: 'x', name: 'Barat Makeup', category: 'makeup', durationMin: 150, price: 40000 }, { id: 'y', name: 'Party Makeup', category: 'makeup', durationMin: 60, price: 7500 }, { id: 'z', name: 'Gel Nails', category: 'nails', durationMin: 60, price: 6000 }] });
  assert(fixture.branches.map(b => b.province).join() === 'punjab,sindh,unset' && fixture.branches[2].lat === null, 'city → province / unset');
  assert(fixture.staff[0].stationId === null && fixture.stations.length === MAX_STATIONS, 'front desk has no station; stations capped');
  assert(fixture.services[0].bridal && !fixture.services[1].bridal && fixture.services[2].stationTypes[0] === 'nail', 'service kinds');
  const sunday = Date.UTC(2026, 9, 11, 7, 0); // Sunday 12:00 PKT
  const closed = new MockAdapter({ ...SALONS[0], branches: SALONS[0].branches.map(b => ({ ...b, hours: [{ day: 'Sunday', open: false, from: '10:00', to: '18:00' }] })) }, { seed: 3, now: sunday });
  assert(closed.snapshot().appointments.length === 0 && closed.snapshot().branches.every(b => !b.open), 'closed day has no bookings');

  const m = new MockAdapter(SALONS[0], { seed: 7, now: Date.UTC(2026, 9, 11, 14, 0) }); // 19:00 PKT
  const s = m.snapshot();
  for (const st of s.stations) {
    const booked = s.appointments.filter(a => a.stationId === st.id && a.source !== 'walk-in').sort((a, b) => a.start - b.start);
    booked.forEach((a, i) => assert(i === 0 || a.start >= booked[i - 1].end, `no double-booking on ${st.id}`));
    assert(s.appointments.filter(a => a.stationId === st.id && a.status === 'in-progress').length <= 1, `one client per station ${st.id}`);
  }
  for (const a of s.appointments) {
    const svc = s.services.find(x => x.id === a.serviceId);
    assert(a.price >= svc.price && a.price <= (svc.priceMax ?? svc.price) && (a.end - a.start) / MIN === svc.durationMin, `price and length from the menu ${a.id}`);
    assert(!svc.bridal || (a.bridal && a.bridal.advancePaid <= a.bridal.advanceDue), `bridal advance ${a.id}`);
  }
  for (const p of s.payments) assert(p.total === p.subtotal + p.tax + p.tip && p.tax === taxOn(p.subtotal, p.taxRate), `payment maths ${p.id}`);
  assert(s.clients.every(c => /^\+92 3\d\d \d{7}$/.test(c.phone)), 'phone format');
  const st = stats(s);
  assert(st.collected === st.net + st.tax + st.tips, 'collected adds up');
  assert(m.lastWeek.now === m.now - 7 * DAY, 'last week runs in lockstep');
  const hr = hourly(s), one = hourly(s, s.branches[0].id);
  assert(one.rows.reduce((t, r) => t + r.collected, 0) === stats(s, s.branches[0].id).collected, 'hourly per branch');
  assert(hr.rows.reduce((t, r) => t + r.collected, 0) === st.collected && hr.rows.reduce((t, r) => t + r.served, 0) === st.done, 'hourly totals match');

  // Live data: a two-service booking, a paid booking, a counter sale with no booking, unknown staff.
  const t0 = Date.UTC(2026, 9, 11, 9, 0); // 14:00 PKT
  const live = liveSnapshot({ now: t0 + 30 * MIN, salon: { id: 'u', name: 'Live' }, hours: null, branches: [{ id: 'main', name: 'Main', city: 'Lahore' }],
    staff: [{ id: 'p1', name: 'Sara', role: 'senior-stylist', branchId: 'main' }, { id: 'p2', name: 'Ali', role: 'receptionist', branchId: 'main' }],
    services: [{ id: 'cut', name: 'Haircut', category: 'hair', durationMin: 30, price: 1500, priceMax: null }, { id: 'nail', name: 'Gel Nails', category: 'nails', durationMin: 60, price: 6000, priceMax: null }],
    appointments: [
      { id: 'a1', branchId: 'main', staffId: 'p1', clientId: 'c1', clientName: 'Hina', clientPhone: '•••• 123', serviceIds: ['cut', 'nail'], serviceNames: ['Haircut', 'Gel Nails'], start: t0, end: t0 + 90 * MIN, status: 'in-progress', source: 'agent', price: 7500 },
      { id: 'a2', branchId: 'main', staffId: 'gone', clientId: 'c2', clientName: 'Zara', clientPhone: '', serviceIds: ['cut'], serviceNames: ['Haircut'], start: t0 - 60 * MIN, end: t0 - 30 * MIN, status: 'completed', source: 'web', price: 1500 }],
    payments: [
      { id: 'i1', branchId: 'main', appointmentId: 'a2', staffId: null, clientId: 'c2', clientName: 'Zara', clientPhone: '', description: 'Haircut', at: t0 - 25 * MIN, total: 1740, tax: 240, method: 'card' },
      { id: 'i2', branchId: 'main', appointmentId: null, staffId: 'p1', clientId: null, clientName: 'Walk-in', clientPhone: '', description: 'Shampoo', at: t0, total: 900, tax: 0, method: '' }],
    lastWeek: { date: t0 - 7 * DAY, byBranch: { main: { collected: 2000, served: 1 } } } });
  const li = idx(live), ls = stats(live);
  assert(live.appointments.length === 3 && ls.collected === 2640 && ls.done === 2, 'live: counter sale counted as a finished walk-in');
  assert(li.service.get(li.appt.get('a1').serviceId).name === 'Haircut + Gel Nails' && li.appt.get('a1').source === 'manual', 'live: combined services, unknown source');
  assert(live.appointments.every(a => li.station.has(a.stationId) && li.staff.has(a.staffId) && li.client.has(a.clientId)), 'live: every booking has a station, staff member and client');
  assert(live.payments.every(p => li.appt.has(p.appointmentId) && p.total === p.subtotal + p.tax + p.tip) && live.payments[1].method === 'cash', 'live: payments link up');
  assert(hourly(live).rows.reduce((t, r) => t + r.collected, 0) === ls.collected, 'live: hourly totals match');
  return `Self-test passed (${s.appointments.length} appointments, ${s.payments.length} payments; live mapping ok)`;
}

// Keep keyboard focus on the same control when a panel re-renders.
function paint(el, html) {
  const key = el.contains(document.activeElement) ? document.activeElement.dataset.fk : null;
  el.innerHTML = html;
  if (key) el.querySelector(`[data-fk="${CSS.escape(key)}"]`)?.focus({ preventScroll: true });
}

function trend(now, before, label) {
  if (!before) return '';
  const pct = Math.round((now - before) / before * 100);
  return `<div class="t ${pct >= 0 ? 'green' : 'red'}">${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct)}% <span>vs ${label}</span></div>`;
}

// ── Service tracker (bottom left)
function renderTracker(s) {
  const el = $('#tracker'), I = idx(s), a = I.appt.get(view.sel);
  el.hidden = !a;
  if (!a) return;
  const svc = I.service.get(a.serviceId), pay = s.payments.find(p => p.appointmentId === a.id);
  const planned = a.end - a.start, estEnd = a.startedAt ? a.startedAt + planned : a.end;
  const steps = [];
  if (a.bridal) steps.push({ l: 'Advance', t: a.bridal.advanceStatus === 'paid' ? 'Paid' : a.bridal.advanceStatus === 'partial' ? 'Half paid' : 'Not paid', done: a.bridal.advanceStatus === 'paid', bad: a.bridal.advanceStatus !== 'paid' });
  steps.push({ l: 'Booked slot', t: clock(a.start), done: true });
  steps.push(a.status === 'no-show' ? { l: 'Arrived', t: 'No-show', bad: true } : { l: 'Arrived', t: a.arrivedAt ? clock(a.arrivedAt) : '—', done: !!a.arrivedAt });
  steps.push({ l: `In ${svc.category === 'skin' ? 'treatment' : 'chair'}`, t: a.startedAt ? clock(a.startedAt) : '—', done: !!a.startedAt });
  steps.push({ l: a.completedAt ? 'Finished' : 'Est. finish', t: clock(a.completedAt ?? estEnd), done: !!a.completedAt, est: !a.completedAt });
  steps.push({ l: 'Paid', t: pay ? rs(pay.total) : '—', done: !!pay });
  const nowIdx = steps.findIndex(x => !x.done && !x.bad);

  let cls = '', n, sub;
  if (a.status === 'in-progress') {
    const left = Math.round((estEnd - s.now) / MIN);
    [cls, n, sub] = left >= 0 ? ['', `${left} min left`, 'On schedule'] : ['late', `+${-left} min`, 'Running over time'];
  } else if (a.status === 'arrived') {
    const w = Math.max(0, Math.round((s.now - Math.max(a.arrivedAt, a.start)) / MIN));
    [cls, n, sub] = [w >= 15 ? 'late' : 'wait', `Waiting ${w} min`, w ? 'Station still busy' : 'Starting shortly'];
  } else if (a.status === 'booked' || a.status === 'confirmed') {
    const m = Math.round((a.start - s.now) / MIN);
    [cls, n, sub] = m >= 0 ? ['idle', `In ${m} min`, a.status === 'confirmed' ? 'Confirmed' : 'Not yet confirmed'] : ['late', `${-m} min late`, 'Client not here yet'];
  } else if (a.status === 'completed') {
    const over = Math.round((a.completedAt - a.startedAt - planned) / MIN);
    [cls, n, sub] = ['', 'Done', over > 0 ? `Took ${over} min longer than booked` : 'Finished on time'];
  } else [cls, n, sub] = ['late', STATUS[a.status][0], 'Slot lost'];

  el.innerHTML = `
    <div class="top"><div><div class="panel-title">Service Tracker</div>
      <div class="sub"><span class="tag">${esc(shortName(I.client.get(a.clientId).name))}</span><span>${esc(svc.name)}</span><span>${esc(I.branch.get(a.branchId).name)} · ${esc(I.station.get(a.stationId).label)}</span></div></div>
      <div class="count ${cls}"><div class="n num">${n}</div><div class="s ${cls === 'late' ? 'red' : cls === 'wait' ? 'orange' : cls === 'idle' ? 'muted' : 'green'}">${sub}</div></div></div>
    <div class="steps">${steps.map((x, i) => `<div class="step${x.done ? ' done' : ''}${i === nowIdx ? ' now' : ''}${x.bad ? ' bad' : ''}${x.est ? ' est' : ''}">
      <span class="c">${x.done ? icon('check') : x.bad ? icon('x') : ''}</span><div class="t num">${x.t}</div><div class="l">${x.l}</div></div>`).join('')}</div>`;
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const skyCanvas = Object.assign(document.createElement('canvas'), { width: 2, height: 512 });
scene.background = new THREE.CanvasTexture(skyCanvas);
scene.background.colorSpace = THREE.SRGBColorSpace;
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.25;
const hemi = new THREE.HemisphereLight(0xc9b5ff, 0x3a2440, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffb27a, 2.2);
sun.position.set(-14, 12, 10);

Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22 });

const ambient = new THREE.AmbientLight(0xffe6d0, 0.35);
scene.add(ambient);

// Time of day follows the snapshot clock (PKT): night → dusk → day and back. Each look is
// [sky stops top→horizon, hemisphere sky, hemisphere ground, hemisphere, sun colour, sun, ambient, window glow].
const LOOKS = {
  night: [['#07061a', '#120d33', '#1f1750', '#2e2260', '#3a2b6a'], '#8a7cd6', '#2a2140', 0.75, '#9fb0ff', 0.5, 0.3, 1],
  dusk: [['#0f0a1e', '#2a1450', '#6b2a6e', '#c4573f', '#f08a4b'], '#c9b5ff', '#3a2440', 1.1, '#ffb27a', 2.2, 0.35, 0.7],
  day: [['#2a6bd1', '#4f8fe3', '#86b7ee', '#bcd8f5', '#e8f1fb'], '#dcebff', '#8c7f6c', 1.5, '#fff3dc', 2.8, 0.5, 0],
};
const SKY_STOPS = [0, 0.4, 0.72, 0.9, 1];
const mixHex = (a, b, k) => `#${new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString()}`;
const mixNum = (a, b, k) => a + (b - a) * k;
// 0 = night, 1 = full day; dawn 05:00–07:00, dusk 17:00–19:30.
function daylight(now) {
  const h = (now + PKT_OFFSET) % DAY / HOUR;
  return h < 5 || h > 19.5 ? 0 : h < 7 ? (h - 5) / 2 : h <= 17 ? 1 : 1 - (h - 17) / 2.5;
}
let skyAt = null;
function applySky(now) {
  const d = Math.round(daylight(now) * 50) / 50;
  if (d === skyAt) return;
  skyAt = d;
  const [a, b, k] = d < 0.5 ? [LOOKS.night, LOOKS.dusk, d * 2] : [LOOKS.dusk, LOOKS.day, d * 2 - 1];
  const ctx = skyCanvas.getContext('2d'), g = ctx.createLinearGradient(0, 0, 0, 512);
  SKY_STOPS.forEach((o, i) => g.addColorStop(o, mixHex(a[0][i], b[0][i], k)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 512);
  scene.background.needsUpdate = true;
  hemi.color.set(mixHex(a[1], b[1], k)); hemi.groundColor.set(mixHex(a[2], b[2], k)); hemi.intensity = mixNum(a[3], b[3], k);
  sun.color.set(mixHex(a[4], b[4], k)); sun.intensity = mixNum(a[5], b[5], k); ambient.intensity = mixNum(a[6], b[6], k);
  windowGlow = mixNum(a[7], b[7], k);
  for (const [side] of towerMats.values()) side.emissiveIntensity = windowGlow;
  // The sun crosses from east to west over the day; at night the same light stands in for the moon.
  const arc = Math.PI * Math.min(1, Math.max(0, ((now + PKT_OFFSET) % DAY / HOUR - 6) / 13));
  sun.position.set(-18 * Math.cos(arc), 6 + 10 * Math.sin(arc), 10);
}


const matCache = new Map();
const clay = (color, extra = {}) => {
  const key = color + JSON.stringify(extra);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.85, flatShading: true, ...extra }));
  return matCache.get(key);
};
const glow = (color, intensity = 1.2) => clay(color, { emissive: color, emissiveIntensity: intensity });
function mesh(geo, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, typeof mat === 'string' ? clay(mat) : mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent?.add(m);
  return m;
}
const box = (w, h, d, color, x, y, z, parent) => mesh(new THREE.BoxGeometry(w, h, d), color, x, y, z, parent);
function label(el, x, y, z, parent) {
  const o = new CSS2DObject(el);
  o.position.set(x, y, z);
  parent.add(o);
  return o;
}
const div = (cls, html = '') => Object.assign(document.createElement(cls === 'blabel' ? 'button' : 'div'), { className: cls, innerHTML: html });
function tree(g, x, z, y = 0, s = 1) {
  mesh(new THREE.CylinderGeometry(0.04 * s, 0.06 * s, 0.6 * s, 5), '#6b4a34', x, y + 0.3 * s, z, g);
  const top = mesh(new THREE.IcosahedronGeometry(0.32 * s, 0), '#3f7a4f', x, y + 0.7 * s, z, g);
  top.scale.y = 0.75;
}

// CSS2D labels are DOM elements, so hiding a group has to hide its labels explicitly.
function setShown(g, on) {
  g.visible = on;
  g.traverse(o => { if (o.isCSS2DObject) { o.visible = on; o.element.style.display = on ? '' : 'none'; } });
}
function disposeGroup(g) {
  g.traverse(o => { if (o.isCSS2DObject) o.element.remove(); if (o.geometry) o.geometry.dispose(); });
  g.removeFromParent();
}

// ── Network view: the city
// A made-up modern city on a block grid. Each branch gets a block near the middle; the rest is towers,
// low-rise and parks, laid out from a fixed seed so the city looks the same on every visit.
const PITCH = 3.4, ROAD = 0.9, BLOCK = PITCH - ROAD, HALF = 3; // blocks run -HALF..HALF on both axes
const EDGE = (HALF + 0.5) * PITCH, SIDEWALK = ROAD / 2 - 0.1;
const NET_HOME = { pos: new THREE.Vector3(0, 23, 23), target: new THREE.Vector3(0, 0, 0.5) };
const WALK = 40 * MIN; // how long a client takes to walk in, or home again
const CLIENT_RING = { coming: '#a78bfa', waiting: '#f97316', leaving: '#22c55e' };

// Facade: pale walls and blue glass by day; a second map lights some of the windows after dark.
function facade(wall, lit, dark) {
  const c = Object.assign(document.createElement('canvas'), { width: 64, height: 128 }), ctx = c.getContext('2d'), rng = mulberry32(42);
  ctx.fillStyle = wall; ctx.fillRect(0, 0, 64, 128);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 4; x++) {
    ctx.fillStyle = rng() < 0.45 ? lit : dark;
    ctx.fillRect(4 + x * 15, 3 + y * 8, 11, 5);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const WINDOWS = facade('#c9cdd9', '#5f7fa8', '#5f7fa8'), WINDOW_GLOW = facade('#000000', '#ffd08a', '#000000');
const towerMats = new Map();
let windowGlow = 0.7;
function towerMat(tint, h) {
  const key = `${tint}${Math.round(h * 2)}`;
  if (!towerMats.has(key)) {
    const map = WINDOWS.clone(), emissiveMap = WINDOW_GLOW.clone();
    for (const t of [map, emissiveMap]) t.repeat.set(1.5, Math.max(0.25, Math.round(h * 2) / 5));
    const side = new THREE.MeshStandardMaterial({ color: tint, map, emissive: '#ffffff', emissiveMap, emissiveIntensity: windowGlow, roughness: 0.4, metalness: 0.2 });
    const roof = clay('#8d8aa0');
    towerMats.set(key, [side, side, roof, roof, side, side]);
  }
  return towerMats.get(key);
}

function car(color) {
  const g = new THREE.Group();
  box(0.56, 0.16, 0.28, color, 0, 0.12, 0, g);
  box(0.3, 0.12, 0.24, '#d9d3f0', -0.03, 0.26, 0, g);
  for (const z of [-0.08, 0.08]) box(0.02, 0.05, 0.06, glow('#fff3c4', 1.5), 0.29, 0.13, z, g);
  return g;
}

function buildNetwork(s) {
  disposeGroup(network.group);
  network.group = new THREE.Group();
  network.buildings.clear(); network.clients.clear(); network.cars = [];
  scene.add(network.group);
  const g = network.group, rng = mulberry32(7);

  mesh(new THREE.CylinderGeometry(26, 26, 0.2, 9), '#241a3f', 0, -0.35, -1, g).receiveShadow = true;
  box(EDGE * 2 + 0.6, 0.3, EDGE * 2 + 0.6, '#3b3a45', 0, -0.15, 0, g); // asphalt
  for (let k = -HALF - 1; k <= HALF; k++) { // lane markings
    const at = (k + 0.5) * PITCH;
    box(EDGE * 2, 0.01, 0.04, '#a9a6b8', 0, 0.005, at, g);
    box(0.04, 0.01, EDGE * 2, '#a9a6b8', at, 0.005, 0, g);
  }

  // Branches take the blocks nearest the middle; their neighbours stay low so the salons can be seen.
  const blocks = [];
  for (let i = -HALF; i <= HALF; i++) for (let j = -HALF; j <= HALF; j++) blocks.push([i, j]);
  blocks.sort((a, b) => Math.hypot(a[0], a[1] - 0.4) - Math.hypot(b[0], b[1] - 0.4));
  const salonBlocks = new Map(s.branches.slice(0, blocks.length).map((b, n) => [blocks[n].join(), b]));
  const nearSalon = (i, j) => [...salonBlocks.keys()].some(k => { const [a, b] = k.split(',').map(Number); return Math.max(Math.abs(a - i), Math.abs(b - j)) <= 1; });

  for (const [i, j] of blocks) {
    const cx = i * PITCH, cz = j * PITCH;
    box(BLOCK, 0.1, BLOCK, '#9c99a8', cx, 0.05, cz, g); // pavement
    const branch = salonBlocks.get(`${i},${j}`);
    if (branch) { buildSalon(s, branch, cx, cz, g); continue; }
    const low = nearSalon(i, j);
    for (const [lx, lz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const x = cx + lx * BLOCK / 4, z = cz + lz * BLOCK / 4, r = rng();
      if (r < 0.15) { // pocket park
        box(BLOCK / 2 - 0.15, 0.04, BLOCK / 2 - 0.15, '#3e6b4c', x, 0.12, z, g);
        tree(g, x - 0.2, z - 0.15, 0.1, 0.8); tree(g, x + 0.25, z + 0.2, 0.1, 0.65);
        continue;
      }
      const tall = !low && r > 0.45;
      const h = tall ? 1.4 + rng() * 2 : 0.4 + rng() * 0.7, w = BLOCK / 2 - 0.2 - rng() * 0.2;
      const tint = ['#ffffff', '#d8ccff', '#ffd9cc', '#c9e2ff'][Math.floor(rng() * 4)];
      mesh(new THREE.BoxGeometry(w, h, w), towerMat(tint, h), x, 0.1 + h / 2, z, g);
      if (tall && rng() < 0.5) box(w * 0.4, 0.25, w * 0.4, '#a7a3b8', x, 0.1 + h + 0.12, z, g); // rooftop plant room
    }
  }

  // Traffic: a few cars looping along the roads in both directions.
  for (let n = 0; n < 14; n++) {
    const axis = n % 2 ? 'x' : 'z', dir = rng() < 0.5 ? 1 : -1, line = (Math.floor(rng() * (2 * HALF + 2)) - HALF - 0.5) * PITCH;
    const obj = car(['#ef4444', '#f2ecf5', '#3b82f6', '#eab308', '#1f1b2e', '#a78bfa'][n % 6]);
    obj.rotation.y = (axis === 'x' ? 0 : -Math.PI / 2) + (dir < 0 ? Math.PI : 0);
    g.add(obj);
    network.cars.push({ obj, axis, dir, line: line + dir * 0.18, speed: 1.2 + rng() * 1.2, at: rng() * EDGE * 2 });
  }

  network.people = new THREE.Group();
  g.add(network.people);
}

function buildSalon(s, b, cx, cz, g) {
  const bg = new THREE.Group();
  bg.position.set(cx, 0.1, cz);
  bg.scale.setScalar(1.25);
  bg.userData.branchId = b.id;
  box(1.6, 0.04, 1.6, '#e9dccd', 0, 0.02, 0.15, bg); // plot
  box(1.2, 0.8, 0.9, '#f1e4d4', 0, 0.42, 0, bg);
  const roof = mesh(new THREE.ConeGeometry(0.95, 0.5, 4), '#6d28d9', 0, 1.07, 0, bg);
  roof.rotation.y = Math.PI / 4;
  roof.scale.z = 0.75;
  for (const wx of [-0.38, 0.38]) box(0.26, 0.24, 0.03, glow('#ffc977'), wx, 0.55, 0.46, bg); // lit windows
  box(0.26, 0.4, 0.03, glow('#ffb35c', 0.7), 0, 0.24, 0.46, bg); // door
  box(1.4, 0.06, 0.4, '#2b2340', 0, 0.06, 0.72, bg); // pip plinth
  const stations = s.stations.filter(st => st.branchId === b.id);
  const pips = stations.map((st, k) => {
    const pip = mesh(new THREE.SphereGeometry(0.1, 10, 8), new THREE.MeshStandardMaterial({ color: COLORS.free, emissive: COLORS.free, emissiveIntensity: 0.3, roughness: 0.4 }),
      (k - (stations.length - 1) / 2) * 0.3, 0.17, 0.72, bg);
    pip.userData.stationId = st.id;
    return pip;
  });
  tree(bg, -0.75, -0.45); tree(bg, 0.78, -0.35, 0, 0.85); tree(bg, -0.8, 0.6, 0, 0.7);
  const el = div('blabel');
  el.type = 'button';
  el.addEventListener('click', () => openBranch(b.id));
  const wrap = document.createElement('div');
  wrap.append(el);
  label(wrap, 0, 1.7, 0, bg);
  g.add(bg);
  // Clients walk the pavement: along their own street, up the road beside the salon, then to its door.
  const door = new THREE.Vector3(cx, 0.1, cz + PITCH / 2 - SIDEWALK);
  network.buildings.set(b.id, { group: bg, pips, el, door, sideRoad: cx + PITCH / 2 - SIDEWALK });
}

function strHash(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }

// Where a client lives (a spot on a city pavement) and the route from there to the salon's door.
function clientRoute(a, bld) {
  const rng = mulberry32(strHash(a.clientId));
  const z = (Math.floor(rng() * (2 * HALF + 2)) - HALF - 0.5) * PITCH + (rng() < 0.5 ? -SIDEWALK : SIDEWALK);
  const home = new THREE.Vector3((rng() * 2 - 1) * (EDGE - 0.5), 0.1, z);
  const { door, sideRoad } = bld;
  return [home, new THREE.Vector3(sideRoad, 0.1, z), new THREE.Vector3(sideRoad, 0.1, door.z), door];
}
function along(path, f) {
  const lens = path.slice(1).map((p, i) => p.distanceTo(path[i])), total = lens.reduce((t, l) => t + l, 0);
  let d = f * total;
  for (let i = 0; i < lens.length; i++) { if (d <= lens[i]) return path[i].clone().lerp(path[i + 1], lens[i] ? d / lens[i] : 0); d -= lens[i]; }
  return path.at(-1).clone();
}

// Today's clients out in the city: at home until about 40 min before their slot, then walking in;
// queued outside the door while waiting; out of sight while in the chair; walking home after.
function updateClients(s) {
  const seen = new Set(), queue = new Map();
  for (const a of s.appointments.slice().sort((x, y) => (x.arrivedAt ?? 0) - (y.arrivedAt ?? 0))) {
    const bld = network.buildings.get(a.branchId);
    if (!bld) continue;
    let f = null, mood = null;
    if (a.status === 'booked' || a.status === 'confirmed') { f = Math.min(1, Math.max(0, (s.now - a.start + WALK) / WALK)); mood = f > 0 ? 'coming' : null; }
    else if (a.status === 'arrived') { f = 1; mood = 'waiting'; }
    else if (a.status === 'completed' && s.now - a.completedAt < WALK) { f = 1 - (s.now - a.completedAt) / WALK; mood = 'leaving'; }
    if (f == null) continue;
    seen.add(a.id);
    let c = network.clients.get(a.id);
    if (!c) {
      const h = strHash(a.clientId), obj = person(OUTFITS[h % OUTFITS.length], SKIN[h % SKIN.length]);
      obj.scale.setScalar(0.55);
      const ring = mesh(new THREE.TorusGeometry(0.32, 0.06, 4, 16), glow('#a78bfa'), 0, 0.05, 0, obj);
      ring.rotation.x = Math.PI / 2;
      obj.userData.apptId = a.id;
      const route = clientRoute(a, bld);
      obj.position.copy(along(route, f));
      network.people.add(obj);
      c = { obj, ring, route, pos: obj.position.clone() };
      network.clients.set(a.id, c);
    }
    c.pos = along(c.route, f);
    if (mood === 'waiting') { const n = queue.get(a.branchId) ?? 0; queue.set(a.branchId, n + 1); c.pos.x += (n % 2 ? 1 : -1) * (0.35 + 0.3 * Math.floor(n / 2)); }
    c.ring.visible = !!mood;
    if (mood) c.ring.material = glow(CLIENT_RING[mood]);
  }
  for (const [id, c] of network.clients) if (!seen.has(id)) { disposeGroup(c.obj); network.clients.delete(id); }
}

function animateCity(dt) {
  for (const c of network.cars) {
    c.at = (c.at + c.dir * c.speed * dt + EDGE * 4) % (EDGE * 2);
    const run = c.at - EDGE;
    if (c.axis === 'x') c.obj.position.set(run, 0.02, c.line); else c.obj.position.set(c.line, 0.02, run);
  }
  for (const { obj, pos } of network.clients.values()) {
    const dx = pos.x - obj.position.x, dz = pos.z - obj.position.z, d = Math.hypot(dx, dz);
    if (d < 0.02) continue;
    const k = reduceMotion ? 1 : Math.min(1, 2.5 * dt / d);
    obj.rotation.y = Math.atan2(dx, dz);
    obj.position.x += dx * k; obj.position.z += dz * k;
  }
}

function updateNetwork(s) {
  const key = s.branches.map(b => b.id).join() + s.stations.length;
  if (key !== network.key) { network.key = key; buildNetwork(s); setShown(network.group, !view.branchId); }
  const I = idx(s);
  for (const [id, bld] of network.buildings) {
    const b = I.branch.get(id), st = stats(s, id);
    for (const pip of bld.pips) {
      const state = stationState(s, I.station.get(pip.userData.stationId)).state;
      pip.material.color.set(COLORS[state]);
      pip.material.emissive.set(COLORS[state]);
      pip.userData.state = state;
    }
    const warn = [st.late && `${st.late} over time`, st.longestWait >= 15 && `wait ${st.longestWait} min`].filter(Boolean).join(' · ');
    bld.el.innerHTML = `<b>${esc(b.name)}</b><span class="occ">${esc(b.city)}</span>
      <div class="rev num">${rs(st.collected)}</div><div class="occ">${st.busy}/${st.stations} in use · ${st.waiting} waiting</div>${warn ? `<div class="warnline">${warn}</div>` : ''}`;
    bld.el.setAttribute('aria-label', `${b.name}, ${b.city}: ${rs(st.collected)} collected, ${st.busy} of ${st.stations} stations in use. Open floor view.`);
  }
  updateClients(s);
}

  ctx.fillStyle = '#fff'; ctx.font = '600 40px Montserrat, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
